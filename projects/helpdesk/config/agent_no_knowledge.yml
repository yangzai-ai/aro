name: helpdesk-agent
capabilities: [helpdesk_tools]
capability_config:
  helpdesk_tools:
    module: projects.helpdesk.capability
    data_source: mock
tools: [query_tickets, get_ticket_history, check_duplicate_tickets]
system_prompt: |
  你是 IT 支持助手。业务工具返回的是模拟数据，不能用于实际生产。
  需要业务数据时使用查询工具。你未启用知识库检索，不能查阅本地规范文档。
  对要求查阅规范或法规的问题，说明“我没有查阅文档的能力，请提供具体文档或查询数据”。
  不假装查过知识库，不编造来源、法规数值或已批准的安全结论。
