[project]
name = "aro"
version = "1.2.0"
description = "ARO (Agent Runtime & Orchestration) - Enterprise Agent Framework"
authors = [
    {name = "ARO Team"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # LLM & Agent
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "openai>=1.0.0",
    "langchain-openai>=0.2.0",

    # Data & Config
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "jsonschema>=4.23.0",

    # API
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "anyio>=4.0.0",

    # Utils
    "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
documents = [
    "docxtpl>=0.20,<1",
]
mcp = [
    "langchain-mcp-adapters>=0.2.2,<0.3",
    "mcp>=1.30,<2",  # Adapter 0.2.x uses SDK 1.x transport APIs.
]
knowledge = [
    "FlagEmbedding>=1.3.5,<2",
    "torch>=2.6,<3",
    "transformers>=4.44,<5",
    "qdrant-client>=1.15,<2",
    "rank-bm25>=0.2.2,<0.3",
    "jieba>=0.42.1,<0.43",
]
hitl = [
    "langgraph-checkpoint-postgres>=3.2,<4",
    "psycopg[binary]>=3.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "types-pyyaml>=6.0.0",
    "types-jsonschema>=4.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "capabilities", "projects", "api"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["aro"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "langgraph.*",
    "openai.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["FlagEmbedding.*", "rank_bm25.*", "jieba.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["docxtpl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=core",
    "--cov=projects.helpdesk",
    "--cov=capabilities.basic_tools",
    "--cov=capabilities.knowledge",
    "--cov=capabilities.hitl",
    "--cov=capabilities.memory",
    "--cov=capabilities.multiagent",
    "--cov=capabilities.mcp_client",
    "--cov=capabilities.doc_generation",
    "--cov=api",
    "--cov-report=term-missing",
    "--cov-report=html",
]
